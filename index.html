<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Workday Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: two tabbed infinite boards (Whiteboard, Stickies). Slim top bar with tabs, floating tool rail on the left, properties pill top centre, draggable Pomodoro card. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#17202A; --muted:#5B6878; --line:#D6DCE4;
  --accent:#2B57D0; --accent-ink:#FFFFFF; --accent-soft:#E1E8FA; --hi:#FFE45C; --ok:#2F8A5B; --danger:#C93C3C;
  --canvas:#F7F8FA; --canvas-st:#EFEAE0; --dot:rgba(60,75,95,.22);
  --c-ink:#1B2430; --c-blue:#2B57D0; --c-red:#D23B3B; --c-green:#23875A; --c-orange:#E07B10; --c-purple:#7B4CC2;
  --st-yellow:#FFEB8A; --st-orange:#FFD3A3; --st-pink:#FFC9D6; --st-lilac:#E0D3FF; --st-blue:#BFE0FF; --st-teal:#B5EDE4; --st-green:#C8F0C9; --st-grey:#E3E6EA; --st-ink:#2A2620;
  --shadow:0 1px 2px rgba(20,30,50,.08),0 8px 24px rgba(20,30,50,.10);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-hand:"Kalam","Comic Sans MS","Segoe Print",cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161C; --surface:#19202A; --surface-2:#212934; --ink:#E5EAF0; --muted:#97A3B1; --line:#2C3542;
  --accent:#7D9DFF; --accent-ink:#0E1420; --accent-soft:#25314F; --hi:#D9C23A; --ok:#6CC296; --danger:#F07171;
  --canvas:#151B22; --canvas-st:#1A1915; --dot:rgba(200,215,235,.14);
  --c-ink:#E8EDF3; --c-blue:#86A5FF; --c-red:#FF7A7A; --c-green:#6CD29E; --c-orange:#FFB054; --c-purple:#C19BFF;
  --st-yellow:#EAD872; --st-orange:#E8BC8A; --st-pink:#E9B3C0; --st-lilac:#C9BCEB; --st-blue:#A9CBEA; --st-teal:#9FD6CC; --st-green:#B3DBB4; --st-grey:#C9CED5; --st-ink:#1E1B16;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#19202A; --surface-2:#212934; --ink:#E5EAF0; --muted:#97A3B1; --line:#2C3542;
  --accent:#7D9DFF; --accent-ink:#0E1420; --accent-soft:#25314F; --hi:#D9C23A; --ok:#6CC296; --danger:#F07171;
  --canvas:#151B22; --canvas-st:#1A1915; --dot:rgba(200,215,235,.14);
  --c-ink:#E8EDF3; --c-blue:#86A5FF; --c-red:#FF7A7A; --c-green:#6CD29E; --c-orange:#FFB054; --c-purple:#C19BFF;
  --st-yellow:#EAD872; --st-orange:#E8BC8A; --st-pink:#E9B3C0; --st-lilac:#C9BCEB; --st-blue:#A9CBEA; --st-teal:#9FD6CC; --st-green:#B3DBB4; --st-grey:#C9CED5; --st-ink:#1E1B16;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;white-space:nowrap}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.bar{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--hi);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#1A1A1A;transform:rotate(-4deg)}
.brand b{font-family:var(--f-display);font-size:17px;font-weight:800;white-space:nowrap}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;flex:none}
.tab{display:flex;align-items:center;gap:7px;border:0;background:none;padding:5px 12px;border-radius:7px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab svg{width:16px;height:16px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tab .n{font-family:var(--f-mono);font-size:11px;background:var(--surface-2);border-radius:10px;padding:0 6px;color:var(--muted)}
.tab[aria-selected="true"] .n{background:var(--accent-soft);color:var(--accent)}
.bar .sp{flex:1}
.ex{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:8px;padding:4px 6px 4px 10px;font-size:13px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-weight:700;white-space:nowrap;font-size:13.5px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:13px;min-height:32px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn .emo-i{font-size:15px;line-height:1}
.ib{border:0;background:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted);padding:0;flex:none}
.ib:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:18px;height:18px}
.zoom{font-family:var(--f-mono);font-size:12.5px;min-width:52px}
.bar-group{display:flex;align-items:center;gap:2px}

/* stage */
.stage{position:relative;overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);touch-action:none;user-select:none;-webkit-user-select:none}
.stage[data-tab="stickies"]{background-color:var(--canvas-st)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage[data-tool="pen"],.stage[data-tool="hl"],.stage[data-tool="rect"],.stage[data-tool="ellipse"],.stage[data-tool="arrow"],.stage[data-tool="sticky"]{cursor:crosshair}
.stage[data-tool="text"]{cursor:text}
.stage[data-tool="hand"],.stage.panning{cursor:grab}
.stage.grabbing{cursor:grabbing}
.stage[data-tool="eraser"]{cursor:none}
.stage.dropping{box-shadow:inset 0 0 0 3px var(--accent)}
.layer{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.layer .item{pointer-events:auto}
.stage:not([data-tool="select"]) .layer .item{pointer-events:none}
.empty-hint{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);pointer-events:none;max-width:calc(100% - 32px)}
.empty-hint b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink);margin-bottom:4px}

/* tool rail */
.rail{position:absolute;left:14px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:var(--shadow);max-height:calc(100% - 24px);overflow-y:auto}
.tool{position:relative;border:0;background:none;width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:var(--muted);padding:0;flex:none}
.tool svg{width:20px;height:20px}
.tool:hover{background:var(--surface-2);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tool kbd{position:absolute;right:3px;bottom:2px;font-family:var(--f-mono);font-size:9px;opacity:.6}
.rail hr{border:0;border-top:1px solid var(--line);margin:3px 4px}

/* props pill */
.props{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 9px;box-shadow:var(--shadow);width:max-content;max-width:calc(100% - 32px)}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0;flex:none;background:var(--c)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.sw.sq{border-radius:6px}
.custom{position:relative;width:28px;height:28px;border-radius:6px;flex:none;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:conic-gradient(#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#c77dff,#ff6b6b);cursor:pointer}
.custom[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.custom input{position:absolute;inset:-6px;width:40px;height:40px;opacity:0;cursor:pointer;border:0;padding:0}
.sz{width:34px;height:34px;border:0;border-radius:8px;background:none;display:grid;place-items:center;flex:none;padding:0}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz[aria-pressed="true"]{background:var(--accent-soft)}
.props .div{width:1px;height:22px;background:var(--line);flex:none}
.props input[type=search]{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;width:190px;flex:none}
.props .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.props .hint{font-size:12.5px;color:var(--muted);white-space:nowrap}

/* stickies + text items */
.sticky{position:absolute;display:flex;flex-direction:column;background:var(--c);color:var(--sti,var(--st-ink));border-radius:3px;box-shadow:0 2px 3px rgba(0,0,0,.12),0 10px 22px rgba(0,0,0,.12);resize:both;overflow:hidden;min-width:150px;min-height:110px}
.sticky.drag{box-shadow:0 6px 10px rgba(0,0,0,.18),0 22px 40px rgba(0,0,0,.22)}
.grip{display:flex;align-items:center;gap:3px;padding:4px 5px;cursor:grab;touch-action:none;background:rgba(0,0,0,.06)}
.grip .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(0,0,0,.3);padding:0;background:var(--c);flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.grip .gsp{flex:1}
.grip .x{border:0;background:none;color:inherit;opacity:.55;width:22px;height:22px;border-radius:4px;padding:0;font-size:16px;line-height:1;flex:none}
.grip .x:hover{opacity:1;background:rgba(0,0,0,.08)}
.grip .gb{border:0;background:none;color:inherit;opacity:.5;width:24px;height:22px;border-radius:4px;padding:0;display:grid;place-items:center;flex:none}
.grip .gb svg{width:14px;height:14px}
.grip .gb:hover,.grip .gb.on{opacity:1;background:rgba(0,0,0,.08)}
.grip .due{border:0;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;background:rgba(255,255,255,.45);color:inherit;white-space:nowrap;flex:none}
.grip .due.today{background:#F3B23A;color:#2A1D00}
.grip .due.over{background:#C93C3C;color:#FFFFFF}
.sticky.done{filter:saturate(.45)}
.sticky.done textarea{text-decoration:line-through;opacity:.6}
.sticky.dim{opacity:.22}
.sticky.hit{outline:3px solid var(--accent);outline-offset:3px}
.sticky.focusing{outline:3px solid var(--ok);outline-offset:3px}
.sticky textarea{flex:1;border:0;background:none;resize:none;padding:4px 12px 26px;color:inherit;font-family:var(--f-hand);font-size:18px;line-height:1.35;outline:none;user-select:text;-webkit-user-select:text}
.sticky textarea::placeholder{color:inherit;opacity:.5}
.foot{position:absolute;left:0;right:16px;bottom:0;padding:6px 7px 4px;background:linear-gradient(to bottom,transparent,var(--c) 40%);display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;white-space:nowrap;pointer-events:none}
.foot .cl{opacity:.75;padding:1px 3px}
.foot .cl.all{opacity:1;font-weight:700}
.foot .est{pointer-events:auto;border:0;background:none;color:inherit;font:inherit;padding:1px 5px;border-radius:4px;opacity:.75;cursor:pointer}
.foot .est:hover{opacity:1;background:rgba(0,0,0,.08)}
.foot .est.over{font-weight:700;opacity:1}
.foot .est.empty{opacity:0}
.sticky:hover .foot .est.empty,.foot .est.empty:focus-visible{opacity:.55}
@media (hover:none){.foot .est.empty{opacity:.4}}
.text-item{position:absolute;white-space:pre;font-family:var(--f-display);font-weight:600;line-height:1.15;padding:2px 4px;border-radius:4px;min-width:20px;cursor:move;outline:none;user-select:text;-webkit-user-select:text}
.text-item[contenteditable="true"]{cursor:text;box-shadow:0 0 0 1.5px var(--accent);background:color-mix(in srgb,var(--canvas) 80%,transparent)}
.text-item.sel{box-shadow:0 0 0 1.5px var(--accent)}

/* popovers */
.pop{position:absolute;z-index:8;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:var(--shadow)}
.pal{display:grid;grid-template-columns:repeat(5,26px);gap:6px}
.pal .label{grid-column:1/-1}
.duepop{display:flex;flex-direction:column;gap:4px;min-width:190px}
.duepop button{text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;display:flex;justify-content:space-between;gap:12px}
.duepop button:hover{background:var(--surface-2)}
.duepop button span{color:var(--muted);font-size:12.5px}
.duepop input{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:5px 8px;margin-top:4px}
.emo{width:312px;max-width:calc(100% - 16px)}
.emo-tabs{display:flex;gap:2px;margin-bottom:6px;border-bottom:1px solid var(--line);padding-bottom:6px}
.emo-tabs button{border:0;background:none;border-radius:6px;padding:3px 6px;font-size:16px;line-height:1.2;opacity:.6}
.emo-tabs button[aria-pressed="true"]{background:var(--accent-soft);opacity:1}
.emo-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:220px;overflow-y:auto}
.emo-grid button{border:0;background:none;font-size:21px;line-height:1;padding:5px 0;border-radius:6px}
.emo-grid button:hover{background:var(--surface-2)}
.emo-foot{font-size:11.5px;color:var(--muted);margin-top:6px}

/* timer */
.timer{position:absolute;right:16px;bottom:16px;z-index:6;width:272px;max-width:calc(100% - 32px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:calc(100% - 24px);overflow-y:auto}
.timer.dragging{box-shadow:0 2px 4px rgba(0,0,0,.12),0 20px 44px rgba(0,0,0,.22)}
.t-head{display:flex;align-items:center;gap:6px;padding:8px 8px 0 10px;cursor:grab;touch-action:none}
.timer.dragging .t-head{cursor:grabbing}
.t-grip{width:10px;height:16px;flex:none;background-image:radial-gradient(var(--muted) 1.2px,transparent 1.4px);background-size:5px 5px;opacity:.7}
.t-head h2{font-family:var(--f-display);font-size:16px;font-weight:800;margin:0;flex:1;white-space:nowrap}
.t-body{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 14px 14px}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 10px;font-size:12.5px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ring{position:relative;width:150px;aspect-ratio:1;max-width:100%;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.face{font-family:var(--f-mono);font-size:38px;line-height:1;letter-spacing:-.02em}
.face-sub{position:absolute;bottom:34px;font-size:11.5px;color:var(--muted)}
.t-body input[type=text]{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px;font-size:13.5px;text-align:center}
.t-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.cycle{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--muted)}
.cycle i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.cycle i.on{background:var(--accent);border-color:var(--accent)}
.week{width:100%}
.week-bars{display:flex;gap:6px;align-items:flex-end;height:46px;margin-top:4px}
.week-bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:10px;color:var(--muted);font-family:var(--f-mono)}
.week-bars b{display:block;width:100%;background:var(--accent-soft);border-radius:3px;min-height:3px}
.week-bars .today b{background:var(--accent)}
.week-bars .today{color:var(--ink)}
.t-set{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
.t-set label{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted);font-weight:700}
.t-set input[type=number]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 6px;font-family:var(--f-mono)}
.t-set .full{grid-column:1/-1;flex-direction:row;align-items:center;gap:6px}
.t-set input[type=range]{flex:1;accent-color:var(--accent)}
.timer.min{width:auto}
.timer.min .t-body{display:none}
.timer.min .t-head{padding:6px 6px 6px 10px}
.timer.min h2{font-family:var(--f-mono);font-weight:500;font-size:15px}
.timer.run{border-color:var(--accent)}

/* additions */
.tab .n.due-n,.tab[aria-selected="true"] .n.due-n{background:#F3B23A;color:#2A1D00}
.tab .n.due-n.over,.tab[aria-selected="true"] .n.due-n.over{background:var(--danger);color:#FFFFFF}
.park{width:100%;display:flex;flex-direction:column;align-items:center;gap:3px}
.park input{width:100%;border:1px dashed var(--muted);background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;text-align:center}
.park span{font-size:11.5px;color:var(--muted)}
.t-set .presets{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.t-set .full input[type=number]{width:54px;flex:none}
.week-head{display:flex;align-items:center;justify-content:center;gap:8px}
.lnk{border:0;background:none;color:var(--accent);font-weight:700;font-size:11.5px;padding:0 2px;text-decoration:underline;text-underline-offset:2px}
.estgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:2px 0}
.duepop .estgrid button{justify-content:center;border:1px solid var(--line);font-family:var(--f-mono)}
.duepop .estgrid button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.duepop .hint-s{font-size:12px;color:var(--muted);padding:2px 8px}
.log-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.log-add select,.log-add input{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 8px}
.log-add input[type=number]{width:68px}
.log-add input[type=text]{flex:1;min-width:150px}
.modal-box h2.sub{font-size:16px;margin-top:18px}

/* projects */
.projbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-weight:700;white-space:nowrap;flex:none;max-width:200px;min-height:34px}
.projbtn:hover{border-color:var(--muted)}
.projbtn.on{border-color:var(--pc);box-shadow:inset 0 0 0 1px var(--pc)}
.projbtn .pn{overflow:hidden;text-overflow:ellipsis}

<script>
(function(){
const KEY='workday-desk-board-v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dkey(new Date());
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)};
const shortDate=k=>parseKey(k).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const INKS=['ink','blue','red','green','orange','purple'];
const STICKY=['yellow','orange','pink','lilac','blue','teal','green','grey'];
const SIZES=[2,5,10];
const TEXT_PX={2:20,5:30,10:48,20:72};
const textPx=it=>it.fs||TEXT_PX[it.size]||30;

/* ---------- sticky colour helpers ---------- */
const isHex=c=>/^#[0-9a-f]{6}$/i.test(c||'');
const stBg=c=>isHex(c)?c:`var(--st-${STICKY.includes(c)?c:'yellow'})`;
function stInk(c){if(!isHex(c))return 'var(--st-ink)';const n=parseInt(c.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};const L=.2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255);return L>.36?'#1E1B16':'#F7F5F0'}
const stName=c=>isHex(c)?'Custom':c[0].toUpperCase()+c.slice(1);
function dueLabel(k){if(!k)return'';const t=today();if(k===t)return'Today';if(k===addDays(t,1))return'Tomorrow';if(k===addDays(t,-1))return'Yesterday';return shortDate(k)}
function dueMs(it){if(!it.due)return Infinity;const d=parseKey(it.due);if(it.dueT){const[h,m]=it.dueT.split(':').map(Number);d.setHours(h||0,m||0,0,0)}else d.setHours(23,59,59,999);return d.getTime()}
function dueState(it){if(!it.due||it.done)return'';const t=today();if(it.dueT&&dueMs(it)<Date.now())return'over';return it.due<t?'over':it.due===t?'today':''}
const REPS=[['','Does not repeat'],['daily','Every day'],['weekdays','Every weekday (Mon to Fri)'],['weekly','Every week'],['monthly','Every month']];
const REPN={daily:'every day',weekdays:'every weekday',weekly:'every week',monthly:'every month'};
function shortDateY(k){const d=parseKey(k);return d.toLocaleDateString('en-GB',d.getFullYear()===new Date().getFullYear()?{weekday:'short',day:'numeric',month:'short'}:{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function dueText(it){if(!it.due)return'';const t=today(),k=it.due;return(k===t?'Today':k===addDays(t,1)?'Tomorrow':k===addDays(t,-1)?'Yesterday':shortDateY(k))+(it.dueT?' '+it.dueT:'')+(it.rep?' ↻':'')}
function dueFull(it){if(!it.due)return'';return parseKey(it.due).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+(it.dueT?' at '+it.dueT:'')+(it.rep?`, repeats ${REPN[it.rep]||''}`:'')}
function dayFor(tm){const[h,m]=tm.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);return d.getTime()<Date.now()?addDays(today(),1):today()}
function nextDue(k,rep,anchor){const d=parseKey(k);
  if(rep==='daily')d.setDate(d.getDate()+1);
  else if(rep==='weekdays'){do d.setDate(d.getDate()+1);while(d.getDay()===0||d.getDay()===6)}
  else if(rep==='weekly')d.setDate(d.getDate()+7);
  else if(rep==='monthly'){const day=anchor||d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}
  else return null;return dkey(d)}
function setDone(it,v){const was=!!it.done;it.done=!!v;if(v&&!was)it.doneAt=Date.now();if(!v)delete it.doneAt;return v&&!was}

/* ---------- state ---------- */
function seed(){
  const t=today();
  const circ=[];for(let i=0;i<=40;i++){const a=i/40*Math.PI*2+0.3;circ.push([520+Math.cos(a)*(118+Math.sin(i*1.7)*3),150+Math.sin(a)*(64+Math.cos(i*1.3)*3)]);}
  const hl=[];for(let i=0;i<=20;i++)hl.push([60+i*14,330+Math.sin(i/3)*1.5]);
  const yest=Date.now()-86400e3;
  const o={v:3,example:true,tab:'draw',
    boards:{
      draw:{view:{x:80,y:110,z:1},template:null,items:[
        {id:uid(),ex:true,type:'text',x:60,y:20,color:'ink',size:10,text:'Q4 plan sketch \u{1F680}'},
        {id:uid(),ex:true,type:'rect',color:'blue',size:2,x1:60,y1:110,x2:280,y2:200},
        {id:uid(),ex:true,type:'text',x:80,y:135,color:'blue',size:5,text:'Research'},
        {id:uid(),ex:true,type:'arrow',color:'ink',size:5,x1:290,y1:155,x2:395,y2:155},
        {id:uid(),ex:true,type:'stroke',tool:'pen',color:'red',size:5,pts:circ},
        {id:uid(),ex:true,type:'text',x:458,y:130,color:'red',size:5,text:'Draft'},
        {id:uid(),ex:true,type:'stroke',tool:'hl',color:'orange',size:5,pts:hl},

const toWorld=(cx,cy)=>({x:(cx-R.left-S.view.x)/S.view.z,y:(cy-R.top-S.view.y)/S.view.z});
function zoomAt(sx,sy,nz){const v=S.view;nz=clamp(nz,.15,4);const wx=(sx-v.x)/v.z,wy=(sy-v.y)/v.z;v.z=nz;v.x=sx-wx*nz;v.y=sy-wy*nz;closePops();applyView()}
$('#zoomIn').onclick=()=>zoomAt(W/2,H/2,S.view.z*1.2);
$('#zoomOut').onclick=()=>zoomAt(W/2,H/2,S.view.z/1.2);
$('#zoomLbl').onclick=()=>zoomAt(W/2,H/2,1);
$('#fitBtn').onclick=fit;
function bbox(it){
  if(it.type==='stroke'){let a=1e9,b=1e9,c=-1e9,d=-1e9;it.pts.forEach(([x,y])=>{a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);d=Math.max(d,y)});const p=(it.tool==='hl'?it.size*2:it.size/2);return[a-p,b-p,c+p,d+p]}

  if(it.type==='text'){const el=layer.querySelector(`[data-id="${it.id}"]`);const w=el?el.offsetWidth:100,h=el?el.offsetHeight:30;return[it.x,it.y,it.x+w,it.y+h]}

}
function unionBox(list){let a=1e9,b=1e9,c=-1e9,d=-1e9;list.forEach(([x0,y0,x1,y1])=>{a=Math.min(a,x0);b=Math.min(b,y0);c=Math.max(c,x1);d=Math.max(d,y1)});return[a,b,c,d]}
function fit(){
  closePops();

  const[a,b,c,d]=unionBox(boxes);
  const pad=80,z=clamp(Math.min((W-pad*2)/Math.max(1,c-a),(H-pad*2)/Math.max(1,d-b)),.15,2);

}

/* ---------- images ---------- */
const IMG={};
function imgEl(it){const src=S.images[it.img];if(!src)return null;let im=IMG[it.img];if(!im){im=new Image();im.onload=()=>draw();im.src=src;IMG[it.img]=im}return im.complete&&im.naturalWidth?im:null}
function addImageFile(file,p){
  if(!file||!/^image\//.test(file.type)){toast('That file isn’t an image');return}
  if(S.tab!=='draw'){setTab('draw');p=null}
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const max=1400,sc=Math.min(1,max/Math.max(im.width,im.height)),cw=Math.round(im.width*sc),ch=Math.round(im.height*sc);
    const c=document.createElement('canvas');c.width=cw;c.height=ch;const g=c.getContext('2d');g.drawImage(im,0,0,cw,ch);
    let out=c.toDataURL('image/webp',.85);if(!out.startsWith('data:image/webp'))out=c.toDataURL('image/jpeg',.85);
    const png=c.toDataURL('image/png');if(png.length<out.length)out=png;
    const key=uid();S.images[key]=out;
    const w=Math.min(cw,640),h=Math.round(w*ch/cw);p=p||toWorld(R.left+W/2,R.top+H/2);
    pushUndo();const it={id:uid(),type:'image',img:key,x:Math.round(p.x-w/2),y:Math.round(p.y-h/2),w,h,proj:drawProj()};S.items.push(it);
    S.tool='select';stage.dataset.tool='select';sel=new Set([it.id]);renderRail();renderProps();save();draw();updEmpty();
    toast(`Image added (${Math.max(1,Math.round(out.length/1024))} KB). Draw over it with the pen.`);
  };im.onerror=()=>toast('Couldn’t read that image');im.src=r.result};
  r.readAsDataURL(file);
}
$('#imgFile').addEventListener('change',e=>{const f=e.target.files[0];if(f)addImageFile(f);e.target.value=''});

/* ---------- drawing ---------- */
let rafP=false,sel=new Set(),cursor=null,action=null;
function draw(){if(rafP)return;rafP=true;requestAnimationFrame(()=>{rafP=false;paint()})}
function strokePath(pts){
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  if(pts.length<3){pts.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));return}
  for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;ctx.quadraticCurveTo(pts[i][0],pts[i][1],mx,my)}
  const l=pts[pts.length-1];ctx.lineTo(l[0],l[1]);
}
function paintItem(it){
  if(it.type==='image'){const im=imgEl(it);if(im)ctx.drawImage(im,it.x,it.y,it.w,it.h);else{ctx.fillStyle=COL.line;ctx.fillRect(it.x,it.y,it.w,it.h)}return}
  const col=COL[it.color]||COL.ink;ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=1;
  if(it.type==='stroke'){
    const w=it.tool==='hl'?it.size*4:it.size;ctx.lineWidth=w;if(it.tool==='hl'){ctx.globalAlpha=.32;ctx.lineCap='butt'}
    if(it.pts.length===1){ctx.beginPath();ctx.arc(it.pts[0][0],it.pts[0][1],w/2,0,Math.PI*2);ctx.fill()}
    else{strokePath(it.pts);ctx.stroke()}
    ctx.globalAlpha=1;
  } else if(it.type==='rect'){ctx.lineWidth=it.size;const[x0,y0,x1,y1]=bbox(it);ctx.beginPath();ctx.roundRect?ctx.roundRect(x0,y0,x1-x0,y1-y0,4):ctx.rect(x0,y0,x1-x0,y1-y0);ctx.stroke()}
  else if(it.type==='ellipse'){ctx.lineWidth=it.size;const[x0,y0,x1,y1]=bbox(it);ctx.beginPath();ctx.ellipse((x0+x1)/2,(y0+y1)/2,Math.max(.5,(x1-x0)/2),Math.max(.5,(y1-y0)/2),0,0,Math.PI*2);ctx.stroke()}
  else if(it.type==='arrow'){
    ctx.lineWidth=it.size;ctx.beginPath();ctx.moveTo(it.x1,it.y1);ctx.lineTo(it.x2,it.y2);ctx.stroke();
    const a=Math.atan2(it.y2-it.y1,it.x2-it.x1),L=Math.max(12,it.size*3.2);
    ctx.beginPath();ctx.moveTo(it.x2,it.y2);ctx.lineTo(it.x2-L*Math.cos(a-.45),it.y2-L*Math.sin(a-.45));ctx.moveTo(it.x2,it.y2);ctx.lineTo(it.x2-L*Math.cos(a+.45),it.y2-L*Math.sin(a+.45));ctx.stroke();
  }
}
const isInk=it=>it.type!=='sticky'&&it.type!=='text';
function selImage(){if(sel.size!==1)return null;const it=S.items.find(i=>sel.has(i.id));return it&&it.type==='image'?it:null}
function selBox(){const its=S.items.filter(i=>sel.has(i.id));return its.length?unionBox(its.map(bbox)):null}
function handleAt(){const b=selBox(),z=S.view.z,p=(sel.size>1?12:6)/z,s=12/z;return[b[2]+p-s/2,b[3]+p-s/2,s]}
function singleArrow(){if(sel.size!==1)return null;const it=S.items.find(i=>sel.has(i.id));return it&&it.type==='arrow'?it:null}
function grabHandle(p){
  if(!sel.size||!selBox())return null;const z=S.view.z,its=S.items.filter(i=>sel.has(i.id));
  const ar=singleArrow();
  if(ar){for(const k of['1','2'])if(Math.hypot(p.x-ar['x'+k],p.y-ar['y'+k])<=10/z)return{type:'endpoint',item:ar,k,before:snap(),moved:false};return null}
  const[hx,hy,s]=handleAt();
  if(p.x>=hx-s/2&&p.x<=hx+s*1.5&&p.y>=hy-s/2&&p.y<=hy+s*1.5)return{type:'resize',box:selBox(),orig:JSON.parse(JSON.stringify(its)),before:snap(),moved:false,uni:its.some(i=>i.type==='image'||i.type==='text')};
  return null;
}
function scaleInto(it,o,ox,oy,sx,sy){
  const X=x=>ox+(x-ox)*sx,Y=y=>oy+(y-oy)*sy;
  if(o.type==='stroke')it.pts=o.pts.map(q=>[+X(q[0]).toFixed(1),+Y(q[1]).toFixed(1)]);
  else if('x1' in o){it.x1=X(o.x1);it.x2=X(o.x2);it.y1=Y(o.y1);it.y2=Y(o.y2)}
  else if(o.type==='image'){it.x=X(o.x);it.y=Y(o.y);it.w=Math.max(20,o.w*sx);it.h=Math.max(20,o.h*sy)}
  else if(o.type==='text'){it.x=X(o.x);it.y=Y(o.y);it.fs=clamp(Math.round(textPx(o)*sy*10)/10,8,400);const el=layer.querySelector(`[data-id="${it.id}"]`);if(el){el.style.left=it.x+'px';el.style.top=it.y+'px';el.style.fontSize=it.fs+'px'}}
}
function snapPt(x0,y0,x,y,type){const dx=x-x0,dy=y-y0;if(type==='arrow'){const a=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4),L=Math.hypot(dx,dy);return[x0+Math.cos(a)*L,y0+Math.sin(a)*L]}const m=Math.max(Math.abs(dx),Math.abs(dy));return[x0+(dx<0?-m:m),y0+(dy<0?-m:m)]}
function paint(){
  const v=S.view;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR*v.z,0,0,DPR*v.z,DPR*v.x,DPR*v.y);
  if(S.tab==='draw'&&S.boards.draw.template)paintTemplate(S.boards.draw.template);
  if(S.tab==='stickies'&&S.boards.stickies.lanes)paintLanes();
  S.items.forEach(it=>{if(it.type==='image'&&vis(it))paintItem(it)});
  S.items.forEach(it=>{if(isInk(it)&&it.type!=='image'&&vis(it))paintItem(it)});
  if(action&&action.item&&(action.type==='draw'||action.type==='shape'))paintItem(action.item);
  if(sel.size){
    ctx.setLineDash([5/v.z,4/v.z]);ctx.lineWidth=1.5/v.z;ctx.strokeStyle=COL.accent;const p=5/v.z,boxes=[];
    S.items.forEach(it=>{if(!sel.has(it.id))return;const b=bbox(it);boxes.push(b);if(isInk(it))ctx.strokeRect(b[0]-p,b[1]-p,b[2]-b[0]+2*p,b[3]-b[1]+2*p)});
    if(boxes.length>1){const[a,b,c,d]=unionBox(boxes),q=12/v.z;ctx.setLineDash([]);ctx.globalAlpha=.6;ctx.strokeRect(a-q,b-q,c-a+2*q,d-b+2*q);ctx.globalAlpha=1}

    const ar=singleArrow();
    if(ar){[[ar.x1,ar.y1],[ar.x2,ar.y2]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,6/v.z,0,Math.PI*2);ctx.fill();ctx.stroke()})}
    else if(selBox()){const[hx,hy,s]=handleAt();ctx.fillRect(hx,hy,s,s);ctx.strokeRect(hx,hy,s,s)}

  if(action&&action.type==='lasso'&&action.pts.length>1){ctx.beginPath();action.pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.globalAlpha=.08;ctx.fillStyle=COL.accent;ctx.fill();ctx.globalAlpha=1;ctx.setLineDash([6/v.z,4/v.z]);ctx.lineWidth=1.5/v.z;ctx.strokeStyle=COL.accent;ctx.stroke();ctx.setLineDash([])}
  if(S.tool==='eraser'&&cursor){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.lineWidth=1.5;ctx.strokeStyle=COL.muted;ctx.beginPath();ctx.arc(cursor.x,cursor.y,eraserR()*v.z,0,Math.PI*2);ctx.stroke()}
}
const eraserR=()=>({2:8,5:14,10:26}[S.props.size]||14)/S.view.z;

/* ---------- whiteboard templates ---------- */
const TPLS={
  matrix:{name:'Priority matrix',desc:'Urgent vs important, four boxes',box:[-60,0,900,960]},
  week:{name:'Week planner',desc:'Monday to Friday columns with a focus strip',box:[0,0,1264,830]},
  agenda:{name:'Meeting agenda',desc:'Attendees, agenda, notes, decisions, actions',box:[0,0,760,1080]},
  retro:{name:'Retro',desc:'Went well, to improve, actions',box:[0,0,1100,760]}
};
function bgBox(){if(S.tab==='draw'&&S.boards.draw.template)return TPLS[S.boards.draw.template].box;if(S.tab==='stickies'&&S.boards.stickies.lanes)return[0,0,LANE.w*3+LANE.gap*2,900];return null}
function tplText(t,x,y,size,color,weight){ctx.font=`${weight||700} ${size}px "Bricolage Grotesque", system-ui, sans-serif`;ctx.fillStyle=color||COL.muted;ctx.fillText(t,x,y)}
function tplBox(x,y,w,h,tint){

function paintTemplate(k){
  ctx.save();ctx.lineCap='butt';
  if(k==='matrix'){
    tplText('Priority matrix',0,34,26,COL.fg,800);
    const s=420,x0=0,y0=90;
    [[0,0,'Do first','Urgent and important',COL.red],[1,0,'Schedule','Important, not urgent',COL.blue],[0,1,'Delegate','Urgent, not important',COL.orange],[1,1,'Drop','Neither urgent nor important',COL.muted]]
      .forEach(([c,r,t,d,col])=>{const x=x0+c*(s+16),y=y0+r*(s+16);tplBox(x,y,s,s,col);tplText(t,x+18,y+38,22,col,800);tplText(d,x+18,y+62,14,COL.muted,600)});
    tplText('URGENT',x0+s/2-30,y0-12,12,COL.muted);tplText('NOT URGENT',x0+s+16+s/2-44,y0-12,12,COL.muted);
    ctx.save();ctx.translate(x0-16,y0+s/2+40);ctx.rotate(-Math.PI/2);tplText('IMPORTANT',0,0,12,COL.muted);ctx.restore();
    ctx.save();ctx.translate(x0-16,y0+s+16+s/2+56);ctx.rotate(-Math.PI/2);tplText('NOT IMPORTANT',0,0,12,COL.muted);ctx.restore();
  } else if(k==='week'){

  } else if(k==='agenda'){
    tplText('Meeting agenda',0,34,26,COL.fg,800);
    let y=60;[['Meeting and date',80],['Attendees',90],['Agenda',220],['Notes',250],['Decisions',140],['Action items',180]].forEach(([t,h],i)=>{tplBox(0,y,760,h,i===5?COL.green:null);tplText(t,18,y+30,16,i===5?COL.green:COL.fg,800);y+=h+12});
  } else if(k==='retro'){

/* ---------- kanban lanes ---------- */
const LANE={w:260,gap:24,h:2000,names:['To do','Doing','Done']};
const laneX=i=>i*(LANE.w+LANE.gap);
function laneOf(it){const cx=it.x+it.w/2;for(let i=0;i<3;i++)if(cx>=laneX(i)&&cx<laneX(i)+LANE.w)return i;return -1}

function paintLanes(){
  ctx.save();
  LANE.names.forEach((n,i)=>{
    const x=laneX(i);ctx.beginPath();ctx.roundRect?ctx.roundRect(x,0,LANE.w,LANE.h,12):ctx.rect(x,0,LANE.w,LANE.h);
    ctx.globalAlpha=.55;ctx.fillStyle=COL.surface;ctx.fill();ctx.globalAlpha=1;ctx.lineWidth=1.5;ctx.strokeStyle=COL.line;ctx.stroke();
    tplText(n,x+18,34,18,i===2?COL.green:COL.fg,800);

  } else if(el.tagName==='TEXTAREA'){

function insText(ta,text,a,b){ta.setSelectionRange(a,b);let ok=false;try{ok=text?document.execCommand('insertText',false,text):document.execCommand('delete')}catch(err){}if(!ok){ta.setRangeText(text,a,b,'end');ta.dispatchEvent(new Event('input',{bubbles:true}))}}

  const ta=e.target;

  if(e.shiftKey||ta.selectionStart!==ta.selectionEnd)return;
  const v=ta.value,c=ta.selectionStart,ls=v.lastIndexOf('\n',c-1)+1,line=v.slice(ls,c),m=line.match(/^(\s*(?:[-*]\s+)?)\[( |x|X)\]\s?/);
  if(!m)return;e.preventDefault();

  const before=snap(),sx=e.clientX,sy=e.clientY;let lx=sx,ly=sy,moved=false,dup=false;

function archiveDone(){
  const done=S.boards.stickies.items.filter(i=>i.type==='sticky'&&i.done&&vis(i));if(!done.length){toast('No done stickies to archive');return}
  const prevItems=JSON.stringify(S.boards.stickies.items),prevArch=JSON.stringify(S.archive),now=Date.now();
  done.forEach(s=>S.archive.unshift({id:uid(),text:s.text,color:s.color,doneAt:s.doneAt||now,archivedAt:now,pomos:s.pomos||0,proj:s.proj}));
  S.boards.stickies.items=S.boards.stickies.items.filter(i=>!done.includes(i));HIST.stickies={u:[],r:[]};
  save();if(S.tab==='stickies'){renderLayer();draw()}updEmpty();renderProps();updUndo();SFX.done();
  toast(`${done.length} sticky${done.length===1?'':' notes'} archived`,()=>{S.boards.stickies.items=JSON.parse(prevItems);S.archive=JSON.parse(prevArch);save();renderLayer();draw();renderProps();updEmpty();if(!$('#modal').hidden)openArchive()});
}
function dayLabel(ms){const d=new Date(ms),k=dkey(d),t=today();if(k===t)return'Today';if(k===addDays(t,-1))return'Yesterday';if(Date.now()-ms<6*86400e3)return d.toLocaleDateString('en-GB',{weekday:'long'});return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function openArchive(){
  const doneN=S.boards.stickies.items.filter(i=>i.done&&vis(i)).length;
  const groups=[];S.archive.filter(vis).sort((a,b)=>(b.doneAt||b.archivedAt)-(a.doneAt||a.archivedAt)).forEach(a=>{const l=dayLabel(a.doneAt||a.archivedAt);let g=groups.find(x=>x.l===l);if(!g){g={l,items:[]};groups.push(g)}g.items.push(a)});

    <div class="m-row"><button class="btn primary" data-m="arch-now"${doneN?'':' disabled'}>${doneN?`Archive ${doneN} done ${doneN===1?'sticky':'stickies'}`:'No done stickies to archive'}</button><button class="btn" data-m="arch-copy">Copy last 7 days as text</button></div>

function weekText(){
  const since=Date.now()-7*86400e3,rows=[];
  S.archive.forEach(a=>{const t=a.doneAt||a.archivedAt;if(t>=since&&vis(a))rows.push({t,text:a.text,p:a.pomos,pj:a.proj})});
  S.boards.stickies.items.forEach(s=>{if(s.done&&s.doneAt&&s.doneAt>=since&&vis(s))rows.push({t:s.doneAt,text:s.text,p:s.pomos,pj:s.proj})});
  const foc=focusSummary(since);if(!rows.length&&!foc)return'';
  rows.sort((a,b)=>a.t-b.t);let out=rows.length?'Done in the last 7 days'+(projById(S.proj)?' ('+projName(S.proj)+')':'')+'\n':'',last='';
  rows.forEach(r=>{const l=new Date(r.t).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});if(l!==last){out+='\n'+l+'\n';last=l}out+='- '+(r.text||'').replace(/\s*\n\s*/g,' ').trim()+(S.proj==='all'&&projById(r.pj)?' ['+projName(r.pj)+']':'')+(r.p?` (${r.p} focus session${r.p===1?'':'s'})`:'')+'\n'});
  return(out.trim()+(foc?'\n\n'+foc:'')).trim();
}
function focusSummary(since){
  const es=S.log.filter(l=>l.start>=since&&vis(l));if(!es.length)return'';
  const by={};es.forEach(l=>{const k=(l.label||'').trim()||'Unlabelled';(by[k]=by[k]||{n:0,m:0});by[k].n++;by[k].m+=l.min});
  const tot=es.reduce((s,l)=>s+l.min,0),bp={};if(S.proj==='all')es.forEach(l=>{const k=projName(l.proj);bp[k]=(bp[k]||0)+l.min});const pl=Object.keys(bp).length>1?'\nBy project: '+Object.entries(bp).sort((a,b)=>b[1]-a[1]).map(([k,m])=>`${k} ${fmtMin(m)}`).join(', '):'';
  return `Focus time: ${es.length} session${es.length===1?'':'s'}, ${fmtMin(tot)}\n`+Object.entries(by).sort((a,b)=>b[1].m-a[1].m).map(([k,v])=>`- ${k}: ${v.n} session${v.n===1?'':'s'} (${fmtMin(v.m)})`).join('\n')+pl;
}

/* ---------- duplicate, copy, paste ---------- */
const CLIP='workday-desk-items:';let pasteN=0,lastNudge=0;
function cloneItems(list,dx,dy){return list.map(o=>{const c=JSON.parse(JSON.stringify(o));c.id=uid();delete c.ex;moveItem(c,dx,dy);return c})}
function cloneSelInPlace(){const cl=cloneItems(S.items.filter(i=>sel.has(i.id)&&i.type!=='sticky'),0,0);S.items.push(...cl);cl.forEach(c=>{if(c.type==='text')layer.insertAdjacentHTML('beforeend',textHTML(c))});sel=new Set(cl.map(c=>c.id));syncSelClass();renderProps();return cl}
function addClones(cl){const dk=drawProj();cl.forEach(c=>{if(dk)c.proj=dk;else delete c.proj});S.items.push(...cl);sel=new Set(cl.map(c=>c.id));if(S.tool!=='select'){S.tool='select';stage.dataset.tool='select';renderRail()}renderLayer();syncSelClass();renderProps();save();draw();updEmpty()}
function duplicateSel(){if(S.tab!=='draw'||!sel.size)return;pushUndo();addClones(cloneItems(S.items.filter(i=>sel.has(i.id)&&i.type!=='sticky'),20,20))}
function copySel(e,cut){
  if(typing()||S.tab!=='draw'||!sel.size||!$('#modal').hidden||!e.clipboardData)return;
  const its=S.items.filter(i=>sel.has(i.id)),imgs={};its.forEach(i=>{if(i.type==='image')imgs[i.img]=S.images[i.img]});
  e.clipboardData.setData('text/plain',CLIP+JSON.stringify({items:its,images:imgs}));e.preventDefault();pasteN=0;
  if(cut){pushUndo();S.items=S.items.filter(i=>!sel.has(i.id));sel.clear();afterBulk();toast(`${its.length} item${its.length===1?'':'s'} cut`)}
  else toast(`${its.length} item${its.length===1?'':'s'} copied`);
}
document.addEventListener('copy',e=>copySel(e,false));
document.addEventListener('cut',e=>copySel(e,true));
function pasteItems(json){
  let d;try{d=JSON.parse(json)}catch(err){return}if(!d||!Array.isArray(d.items)||!d.items.length)return;
  if(S.tab!=='draw')setTab('draw');
  Object.entries(d.images||{}).forEach(([k,v])=>{if(v&&!S.images[k])S.images[k]=v});
  pasteN++;pushUndo();addClones(cloneItems(d.items.filter(i=>i.type!=='sticky'),24*pasteN,24*pasteN));
}

/* ---------- export, backup, theme ---------- */
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function exportCanvas(){
  const only=sel.size>0,tpl=!only&&S.boards.draw.template,its=S.boards.draw.items.filter(i=>(!only||sel.has(i.id))&&vis(i));
  const boxes=its.map(bbox);if(tpl)boxes.push(TPLS[tpl].box);if(!boxes.length)return null;
  const[a,b,c,d]=unionBox(boxes),pd=40,w=c-a+pd*2,h=d-b+pd*2;
  const sc=Math.max(.1,Math.min(2,8000/Math.max(w,h),Math.sqrt(36e6/(w*h))));
  const out=document.createElement('canvas');out.width=Math.ceil(w*sc);out.height=Math.ceil(h*sc);
  const g=out.getContext('2d');g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--canvas').trim()||'#F7F8FA';g.fillRect(0,0,out.width,out.height);
  g.setTransform(sc,0,0,sc,(pd-a)*sc,(pd-b)*sc);
  const keep=ctx;ctx=g;
  try{
    if(tpl)paintTemplate(tpl);
    its.forEach(it=>{if(it.type==='image')paintItem(it)});
    its.forEach(it=>{if(isInk(it)&&it.type!=='image')paintItem(it)});
    its.forEach(it=>{if(it.type!=='text')return;const fs=textPx(it),lh=fs*1.15;g.font=`600 ${fs}px "Bricolage Grotesque", system-ui, sans-serif`;g.fillStyle=COL[it.color]||COL.fg;g.textBaseline='top';g.globalAlpha=1;
      String(it.text).split('\n').forEach((l,i)=>g.fillText(l,it.x+4,it.y+2+i*lh+(lh-fs)/2))});
  }finally{ctx=keep}
  return out;
}
function exportPNG(copy){
  if(S.tab!=='draw')return;const c=exportCanvas();if(!c){toast('Nothing on the whiteboard to export yet');return}
  if(copy){
    if(!navigator.clipboard||!window.ClipboardItem){toast('This browser can’t copy images. Use Download PNG instead.');return}
    try{navigator.clipboard.write([new ClipboardItem({'image/png':new Promise(r=>c.toBlob(r,'image/png'))})]).then(()=>toast('Image copied. Paste it into Teams, Slack or a document.'),()=>toast('Couldn’t copy the image here. Use Download PNG instead.'))}catch(err){toast('Couldn’t copy the image here. Use Download PNG instead.')}
  } else c.toBlob(b=>{if(!b){toast('Export failed');return}download(`whiteboard-${today()}.png`,b);toast('PNG downloaded')},'image/png');
}

/* Tab title: seconds while visible, whole minutes while hidden (background timers only wake about once a minute) */
function setTitle(){

  if(endAt)t=(document.hidden?`${Math.max(1,Math.ceil(remaining/60))} min left`:fmt(remaining))+' · '+MODE_NAME[mode];
  else if(remaining>0&&remaining<total())t='Paused '+fmt(remaining)+' · '+base;

function drawTimer(){
  const t=total();

/* End chime on the Web Audio clock: the audio thread is not subject to background-tab timer throttling */
function clearChime(){chime.forEach(o=>{try{o.stop()}catch(e){}});chime=[]}
function scheduleChime(){
  clearChime();

  const left=(endAt-Date.now())/1000;if(left<=.05)return;
  for(let s=3;s>=1;s--)if(left-s>.05)chime.push(...SFX.count(left-s));
  chime.push(...(mode==='focus'?SFX.focusEnd(left):SFX.breakEnd(left)));
}
function onAudioState(){if(actx&&actx.state==='running'&&endAt&&!chime.length)scheduleChime()}

/* Worker timer so the phase switch and notification land on time while the tab is hidden */
let wk=null;
try{
  const src='let t;onmessage=e=>{clearTimeout(t);if(e.data>0)t=setTimeout(()=>postMessage(1),e.data)}';
  wk=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
  wk.onmessage=()=>{if(endAt&&endAt-Date.now()<=80){remaining=0;finish()}else armWorker()};
  wk.onerror=()=>{wk=null};
}catch(e){wk=null}
function armWorker(){if(wk)try{wk.postMessage(endAt?Math.max(1,endAt-Date.now()):0)}catch(e){}}

function runTick(){
  clearInterval(tick);lastSec=Math.ceil(remaining);
  tick=setInterval(()=>{
    remaining=Math.max(0,(endAt-Date.now())/1000);if(remaining<=0){finish();return}
    const sec=Math.ceil(remaining);
    if(sec!==lastSec){lastSec=sec;
      if(sec<=3){if(S.timer.sound&&!chime.length)SFX.count()}
      else if(mode==='focus'&&S.timer.tick)SFX.tick(sec%2);
    }
    drawTimer()},100);
}
function setMode(m,autostart){

  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));
  armWorker();saveRun();drawTimer();if(autostart)start(true);
}

}
function pause(){

}
function notify(title,body){

function logSession(start,min,label,sticky,proj){

function finish(opts){

  const away=!!(opts&&opts.away),was=mode,ended=endAt,heard=chime.length>0&&actx&&actx.state==='running';

/* Pick up a running or paused session after a reload */

/* Park a thought: one line during focus becomes a grey sticky in an inbox spot */
function parkThought(text){
  text=text.trim();if(!text)return;
  const bd=S.boards.stickies,st=bd.items.filter(i=>i.type==='sticky'),before=JSON.stringify(bd.items);
  let x,y,w=210,h=120;
  if(bd.lanes){x=laneX(0)+18;y=56+st.filter(s=>laneOf(s)===0).length*164;w=LANE.w-36;h=150}
  else{
    const inbox=st.filter(i=>i.parked&&!i.done),others=st.filter(i=>!(i.parked&&!i.done));
    const left=st.length?Math.min(...st.map(s=>s.x)):0;
    if(inbox.length){const last=inbox.reduce((a,c)=>c.y>a.y||(c.y===a.y&&c.x>a.x)?c:a);x=last.x+230;y=last.y;if(x>left+230*3){x=left;y=last.y+h+16}}

  }
  const ts=S.timer.sticky&&st.find(i=>i.id===S.timer.sticky),pp=ts&&projById(ts.proj)?ts.proj:newProj();
  bd.items.push({id:uid(),type:'sticky',x:Math.round(x),y:Math.round(y),w,h,color:'grey',text,parked:true,proj:pp,upd:Date.now()});
  HIST.stickies.u.push(before);if(HIST.stickies.u.length>100)HIST.stickies.u.shift();HIST.stickies.r=[];

  toast('Parked on the Stickies board. Back to it.');
}

async function readRemote(){const md=(await CL.db.doc(docPath('desk')).get());if(!md.exists)return null;const d=md.data()||{},n=+d.n||0;
  const parts=await Promise.all(Array.from({length:n},(_,i)=>CL.db.doc(docPath('chunk-'+i)).get().then(c=>c.exists?String((c.data()||{}).s||''):'')));return{md:d,parts}}
function applyRemote(json){let d;try{d=JSON.parse(json)}catch(e){return false}if(!d||typeof d!=='object'||!(d.boards||Array.isArray(d.items)))return false;
  const askingName=!$('#modal').hidden&&!!$('#nameIn');CL.applying=true;
  try{S=wire(normalize(d));HIST.draw={u:[],r:[]};HIST.stickies={u:[],r:[]};Object.keys(IMG).forEach(k=>delete IMG[k]);sel.clear();action=null;
    if(askingName&&(S.name||S.askedName))closeModal();
    setTab(S.tab);renderProjBtn();renderBrand();syncTimerSettings();placeTimer();renderWeek();renderSnd();applyTheme();resumeTimer();writeLocal();
  }finally{CL.applying=false}return true}
function idle(){return!typing()&&!action&&$('#modal').hidden&&!ptrs.size&&!CL.timer&&!CL.busy}
async function maybePull(){if(!CL.db||!CL.pending||!idle())return;CL.pending=false;
  try{const r=await readRemote();if(!r||!idle()||(+r.md.at||0)<=CL.at)return;if(applyRemote(r.parts.join(''))){CL.sent=r.parts.slice();CL.at=+r.md.at||0;CL.rev=Math.max(CL.rev,+r.md.rev||0);toast('Updated with changes from your other device')}}catch(e){}}
function watchRemote(){try{CL.db.doc(docPath('desk')).onSnapshot(snap=>{if(!snap.exists)return;const d=snap.data()||{};if(d.dev===CL.dev||(+d.at||0)<=CL.at)return;CL.pending=true;maybePull()},()=>{})}catch(e){}}
setInterval(maybePull,15000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(CL.timer){clearTimeout(CL.timer);CL.timer=null;cloudPush()}}else maybePull()});
let afterDone=false;
function afterCloud(){if(afterDone)return;afterDone=true;if(!CL.db)backupNag();if(!S.name&&!S.askedName&&$('#modal').hidden)openName(true);checkReminders();if(CL.db)watchRemote()}
async function cloudInit(){
  let db=null,user=null,id=null;
  try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
  if(db&&user){try{id=await user.id()}catch(e){}}
  if(!db||!id){CL.ready=true;cloudStatus('local');afterCloud();return}
  CL.db=db;CL.uid=id;cloudStatus('saving');
  try{
    const r=await readRemote();
    if(r){CL.rev=+r.md.rev||0;const rat=+r.md.at||0;
      if(rat>LOCAL_AT&&r.parts.length&&applyRemote(r.parts.join(''))){CL.sent=r.parts.slice();CL.at=rat}
      else CL.sent=r.parts.slice()}
    CL.ready=true;
    if(!CL.at||(+S.savedAt||0)>CL.at)await cloudPush();else cloudStatus('synced');
  }catch(e){CL.ready=true;cloudStatus('error')}
  afterCloud();
}
function cloudStart(){
  let tries=0;const go=()=>{if(window.claude&&typeof window.claude.use==='function'){cloudInit();return}if(++tries<20)setTimeout(go,100);else{CL.ready=true;cloudStatus('local');afterCloud()}};go();
  setTimeout(()=>{if(!CL.ready&&!S.name&&!S.askedName&&$('#modal').hidden)openName(true)},4000);
}

/* ---------- boot ---------- */
applyTheme();readColors();renderSnd();
document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
stage.dataset.tab=S.tab;stage.dataset.tool=S.tool;
renderBrand();renderProjBtn();renderRail();renderProps();renderLayer();resize();updEmpty();updUndo();syncTimerSettings();renderWeek();resumeTimer();renderSync();cloudStart();
document.fonts&&document.fonts.ready.then(()=>{draw();placeTimer()});
let lastDay=today();setInterval(()=>{if(today()!==lastDay){lastDay=today();renderWeek();drawTimer();updBadge();if(S.tab==='stickies')renderLayer()}},60000);
})();
</script>
